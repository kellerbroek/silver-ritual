
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#777887"/>
      <stop offset=".5" stop-color="#f5f5ff"/>
      <stop offset=".75" stop-color="#8c899a"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="background">
      <stop offset="0" stop-color="#443947"/>
      <stop offset="1" stop-color="#09090e"/>
    </radialGradient>

    <radialGradient id="crystal">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c5b9d7"/>
      <stop offset="1" stop-color="#70637f"/>
    </radialGradient>
  </defs>

  <!-- Dark Y2K background -->
  <rect width="400" height="500" fill="url(#background)"/>

  <!-- Silver bracelet chain -->
  <ellipse cx="200" cy="220" rx="125" ry="65"
           fill="none"
           stroke="#555562"
           stroke-width="18"/>

  <ellipse cx="200" cy="220" rx="125" ry="65"
           fill="none"
           stroke="url(#chrome)"
           stroke-width="11"
           stroke-dasharray="16 7"/>

  <!-- Charm connecting rings -->
  <g fill="none" stroke="url(#chrome)" stroke-width="4">
    <circle cx="105" cy="255" r="9"/>
    <circle cx="155" cy="280" r="9"/>
    <circle cx="205" cy="286" r="9"/>
    <circle cx="255" cy="276" r="9"/>
    <circle cx="305" cy="250" r="9"/>
  </g>

  <!-- Hanging charm chains -->
  <g fill="none" stroke="url(#chrome)"
     stroke-width="3" stroke-dasharray="6 4">
    <path d="M105 264 L105 303"/>
    <path d="M155 289 L155 322"/>
    <path d="M205 295 L205 335"/>
    <path d="M255 285 L255 315"/>
    <path d="M305 259 L305 298"/>
  </g>

  <!-- Star charm -->
  <path d="M105 298 L112 315 L130 321
           L112 327 L105 344 L98 327
           L80 321 L98 315Z"
        fill="url(#chrome)"
        stroke="#ffffff" stroke-width="1.5"/>

  <!-- Heart charm -->
  <path d="M155 363
           C128 343 127 324 140 320
           C148 317 154 324 155 329
           C156 324 162 317 170 320
           C183 324 182 343 155 363Z"
        fill="url(#chrome)"
        stroke="#ffffff" stroke-width="1.5"/>

  <!-- Crystal pendant -->
  <path d="M205 330
           L223 347
           L205 383
           L187 347Z"
        fill="url(#crystal)"
        stroke="#ffffff" stroke-width="2"/>

  <path d="M205 330 L205 383 L187 347Z"
        fill="#e4d9ef" opacity=".4"/>

  <!-- Cross charm -->
  <g fill="url(#chrome)" stroke="#ffffff" stroke-width="1">
    <rect x="249" y="312" width="12" height="64" rx="3"/>
    <rect x="231" y="329" width="48" height="12" rx="3"/>
  </g>

  <!-- Crescent moon charm -->
  <path d="M320 302
           A30 30 0 1 0 320 362
           A22 22 0 1 1 320 302Z"
        fill="url(#chrome)"
        stroke="#ffffff" stroke-width="1.5"/>

  <!-- Floating sparkles -->
  <g fill="#ffffff">
    <path d="M65 95 L72 114 L91 121
             L72 128 L65 147 L58 128
             L39 121 L58 114Z"/>

    <path d="M330 130 L336 146 L352 152
             L336 158 L330 174 L324 158
             L308 152 L324 146Z"/>

    <path d="M75 365 L80 379 L94 384
             L80 389 L75 403 L70 389
             L56 384 L70 379Z"/>

    <circle cx="120" cy="105" r="2"/>
    <circle cx="290" cy="85" r="3"/>
    <circle cx="345" cy="365" r="2"/>
  </g>

  <!-- Product title -->
  <text x="200" y="430"
        fill="#e8e4ee"
        font-family="Georgia"
        font-size="19"
        letter-spacing="3"
        text-anchor="middle">
    AFTERGLOW
  </text>

  <text x="200" y="456"
        fill="#aaa4b5"
        font-family="Arial"
        font-size="10"
        letter-spacing="4"
        text-anchor="middle">
    SILVER RITUAL
  </text>
</svg>

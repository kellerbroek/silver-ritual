
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#777887"/>
      <stop offset=".5" stop-color="#f4f4ff"/>
      <stop offset=".75" stop-color="#8e8d9e"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="background">
      <stop offset="0" stop-color="#39323f"/>
      <stop offset="1" stop-color="#09090d"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#background)"/>

  <!-- Bracelet chain -->
  <ellipse cx="200" cy="230" rx="125" ry="75"
    fill="none" stroke="#555562" stroke-width="18"/>
  <ellipse cx="200" cy="230" rx="125" ry="75"
    fill="none" stroke="url(#chrome)"
    stroke-width="12" stroke-dasharray="17 7"/>

  <!-- Center heart charm -->
  <path d="M200 270
           C165 245 145 220 160 200
           C175 180 195 195 200 207
           C205 195 225 180 240 200
           C255 220 235 245 200 270Z"
    fill="url(#chrome)"
    stroke="#ffffff" stroke-width="2"/>

  <path d="M200 252
           C177 234 168 218 177 210
           C187 201 197 212 200 219
           C203 212 213 201 223 210
           C232 218 223 234 200 252Z"
    fill="#403847"/>

  <!-- Small star charm -->
  <path d="M100 245 L106 263 L124 269
           L106 275 L100 293 L94 275
           L76 269 L94 263Z"
    fill="url(#chrome)" stroke="#ffffff"/>

  <!-- Cross charm -->
  <g fill="url(#chrome)" stroke="#ffffff">
    <rect x="286" y="235" width="12" height="58" rx="3"/>
    <rect x="271" y="251" width="42" height="12" rx="3"/>
  </g>

  <!-- Y2K sparkles -->
  <g fill="#ffffff">
    <path d="M70 90 L77 111 L98 118
             L77 125 L70 146 L63 125
             L42 118 L63 111Z"/>
    <path d="M320 110 L325 125 L340 130
             L325 135 L320 150 L315 135
             L300 130 L315 125Z"/>
    <path d="M315 335 L320 349 L334 354
             L320 359 L315 373 L310 359
             L296 354 L310 349Z"/>
    <circle cx="110" cy="355" r="3"/>
    <circle cx="280" cy="75" r="2"/>
    <circle cx="345" cy="220" r="2"/>
  </g>

  <!-- Editorial text -->
  <text x="200" y="425"
    fill="#e6e2ed"
    font-family="Georgia"
    font-size="19"
    letter-spacing="3"
    text-anchor="middle">
    CHROME HEART
  </text>

  <text x="200" y="452"
    fill="#aaa4b5"
    font-family="Arial"
    font-size="10"
    letter-spacing="4"
    text-anchor="middle">
    SILVER RITUAL
  </text>
</svg>
